# Reusable job: runs the chatbot booking flow against ONE environment.
# Called by dev.yml / staging.yml / production.yml / qa-all.yml — the
# environment logic lives here only once.
name: chatbot-e2e (reusable)

on:
  workflow_call:
    inputs:
      env:
        description: "dev | staging | prod"
        required: true
        type: string
      client:
        description: "Client config name (configs/clients/<client>.env)"
        required: true
        type: string
      github_environment:
        description: "GitHub Environment holding this env's secrets/protection rules"
        required: true
        type: string
      tags:
        description: "Cucumber tag expression"
        required: false
        type: string
        default: "@controlcentre"
      retries:
        description: "Cucumber retries for failed scenarios (LLM replies can be flaky)"
        required: false
        type: string
        default: "1"

jobs:
  e2e:
    name: ${{ inputs.env == 'dev' && '🟢 DEV' || inputs.env == 'staging' && '🔵 STAGING' || '🔴 PRODUCTION' }} · ${{ inputs.client }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Scopes secrets (QA_EMAIL / QA_PASSWORD) and protection rules
    # (e.g. required reviewers on "production") to this environment.
    environment: ${{ inputs.github_environment }}
    env:
      CI: "true"
      HEADLESS: "true"
      ENV: ${{ inputs.env }}
      CLIENT: ${{ inputs.client }}
      TAGS: ${{ inputs.tags }}
      RETRY_ATTEMPTS: ${{ inputs.retries }}
      EMAIL: ${{ secrets.QA_EMAIL }}
      PASSWORD: ${{ secrets.QA_PASSWORD }}
      FORCE_COLOR: "1"
      # Fixed cache locations, so the folders we cache are exactly the ones
      # yarn and Playwright write to (setup-node's built-in `cache: yarn`
      # guessed a different folder → "Path Validation Error" on save).
      YARN_CACHE_FOLDER: ${{ github.workspace }}/.cache/yarn
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare cache folders
        run: mkdir -p "$YARN_CACHE_FOLDER" "$PLAYWRIGHT_BROWSERS_PATH"

      - name: Cache yarn packages
        uses: actions/cache@v4
        with:
          path: ${{ env.YARN_CACHE_FOLDER }}
          key: yarn-${{ runner.os }}-node20-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-node20-

      - name: Install dependencies
        run: yarn install --frozen-lockfile --prefer-offline

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Chromium (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Check credentials are configured
        run: |
          if [ -z "$EMAIL" ] || [ -z "$PASSWORD" ]; then
            echo "::error::QA_EMAIL / QA_PASSWORD secrets are missing on the '${{ inputs.github_environment }}' GitHub Environment"
            exit 1
          fi

      - name: Run chatbot automation (${{ inputs.env }})
        id: tests
        continue-on-error: true
        run: node scripts/run-smoke.ts "$TAGS"

      - name: Results summary
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: npx ts-node scripts/ci-summary.ts "${{ inputs.env }}=${{ inputs.client }}" --slack

      # Small, always uploaded: the HTML report + raw results (~3 MB).
      # This is the one to download to see the result.
      # (No retention-days: the repository's own limit applies.)
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.env }}-report
          if-no-files-found: warn
          path: |
            reports/html/${{ inputs.client }}/
            reports/cucumber/${{ inputs.client }}/
            reports/summary/

      # Large, only when tests failed: screenshots, videos, traces, logs.
      # Already-compressed files (zip/webm/mp4/png), so skip re-compressing.
      - name: Upload debug files (failures only)
        if: always() && steps.tests.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.env }}-debug
          if-no-files-found: ignore
          compression-level: 0
          path: |
            screenshots/${{ inputs.client }}/
            videos/${{ inputs.client }}/
            traces/${{ inputs.client }}/
            logs/

      - name: Fail job if tests failed
        if: steps.tests.outcome != 'success'
        run: |
          echo "::error::Chatbot automation FAILED on ${{ inputs.env }} — see the job summary, the ${{ inputs.env }}-report artifact (HTML report) and ${{ inputs.env }}-debug (screenshots, video, trace)"
          exit 1
